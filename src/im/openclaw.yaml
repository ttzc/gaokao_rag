runtime:
  app_name: gaokao_rag            # 可改成自己的名字，无副作用
  user_id: gaokao_user

agent:
  memory_window: 30
  # create_model 用下面三项构造 OpenAIModel（claw.py:115 create_model）。TeamAgent
  # 本身不走它（模型在 src/agent/ 工厂显式构造），但 session 摘要器（ClawSummarizer，
  # memory_window 触发滚动摘要）与 heartbeat 用它真调 LLM——须指向真实端点，
  # ${VAR} 经 _expand_env_vars（os.path.expandvars）从 .env 展开。
  api_key: ${DEEPSEEK_API_KEY}
  api_base: https://api.deepseek.com
  model: deepseek-v4-flash

gateway:
  heartbeat:
    # nanobot HeartbeatConfig 默认 enabled=True + 30min 一轮——真 key 下会每半小时
    # 静默真实计费一次 LLM 调用。MVP 无常驻任务需求，显式关闭。
    enabled: false

channels:
  send_progress: false       # ← 关闭流式增量转发（默认 true = 逐字刷屏）
  send_tool_hints: false     # 工具调用提示也不发（默认已 false，显式写出）
  qq:                                  # ← 新增（MVP 核心）
    enabled: true
    appId: ${QQ_APP_ID}
    secret: ${QQ_APP_SECRET}
    allowFrom: ["*"]
    msgFormat: plain
    # 收消息附件落地目录（nanobot QQ 通道 media_dir）：留空会落到配置文件旁边的
    # src/im/media/qq/（运行产物进源码树，已废弃）。显式指到 L1 文件层 raw 区——
    # 架构文档约定的「QQ 上传统一入口」，data/ 已 gitignore。
    # 注意：相对路径按进程 cwd 解析（runtime.py 仅 expanduser），im_server 须在项目根启动。
    media_dir: data/files/raw/images/uploaded
  # wecom 段删除或 enabled: false（MVP 不用）

# gateway 段删除（WebUI 网关，我们不需要；留着也要改回 127.0.0.1）
