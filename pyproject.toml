[project]
name = "gaokao-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.4.3",
    "openai>=2.54.0",
    "python-dotenv>=1.2.2",
    "trpc-agent-py[knowledge,langfuse]>=1.1.16",
    # mcp 2.0.0 移除了 mcp.shared.session，trpc_agent_sdk(<=1.1.16) 仍 import 它
    # （trpc_agent_sdk/tools/mcp_tool/_utils.py），收紧上限避免 agent 层 import 失败
    "mcp>=1.10.1,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -m 'not integration'"
markers = [
    "integration: 真实 API 调用（DeepSeek / Qwen / DashScope 等），会产生计费；全量 pytest 默认排除，仅 `pytest -m integration` 显式运行。",
]
