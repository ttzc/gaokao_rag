[project]
name = "gaokao-rag"
version = "0.1.0"
description = "Gaokao RAG：高考数学智能备考助手（QQ IM + TeamAgent）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.4.3",
    "openai>=2.54.0",
    "python-dotenv>=1.2.2",
    "trpc-agent-py[knowledge,langfuse,openclaw]>=1.1.16",
    "nanobot-ai<0.2.1",
    # mcp 2.0.0 移除了 mcp.shared.session（mcp/shared/session.py），trpc_agent_sdk 仍 import 它
    # （trpc_agent_sdk/tools/mcp_tool/_utils.py:11）；上游 pyproject 已声明 mcp<2.0.0（L30），
    # 此处显式重申，防止上游未来放宽约束
    "mcp>=1.10.1,<2.0.0",
    "qq-botpy>=1.2.0,<2.0.0",
    # chat 包多行输入（粘贴长题目，scripts/chat/prompt.py）。此前仅为
    # nanobot-ai→questionary 的转依赖，直接使用故显式声明
    "prompt-toolkit>=3.0.53,<4.0.0",
    # chat 包事件流富渲染（scripts/chat/render.py：按事件类型着色/分图标/统计）。
    # 同 prompt-toolkit 先例——现为转依赖，直接使用故显式声明
    "rich>=14.3.4,<15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# 控制台命令入口：uv sync 后可 `uv run gaokao chat` / `uv run gaokao browse ...`
# （照 AlgoNotes `algonotes = "scripts.cli:main"` 先例——入口指向 scripts 包，
# 业务逻辑仍在 src/，scripts 只做 CLI 壳；配套 hatch packages 把 scripts
# 一并打进 editable 安装）
[project.scripts]
gaokao = "scripts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -m 'not integration'"
markers = [
    "integration: 真实 API 调用（DeepSeek / Qwen / DashScope 等），会产生计费；全量 pytest 默认排除，仅 `pytest -m integration` 显式运行。",
]
