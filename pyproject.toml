[project]
name = "gaokao-rag"
version = "0.1.0"
description = "Gaokao RAG：高考数学智能备考助手（QQ IM + TeamAgent）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.4.3",
    "openai>=2.54.0",
    "python-dotenv>=1.2.2",
    "trpc-agent-py[knowledge,langfuse,openclaw]>=1.1.16",
    "nanobot-ai<0.2.1",
    # mcp 2.0.0 移除了 mcp.shared.session（mcp/shared/session.py），trpc_agent_sdk 仍 import 它
    # （trpc_agent_sdk/tools/mcp_tool/_utils.py:11）；上游 pyproject 已声明 mcp<2.0.0（L30），
    # 此处显式重申，防止上游未来放宽约束
    "mcp>=1.10.1,<2.0.0",
    "qq-botpy>=1.2.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -m 'not integration'"
markers = [
    "integration: 真实 API 调用（DeepSeek / Qwen / DashScope 等），会产生计费；全量 pytest 默认排除，仅 `pytest -m integration` 显式运行。",
]
